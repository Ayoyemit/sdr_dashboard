# sdr-api service — Root Directory MUST be repository root (not sdr-api/).
# The Dockerfile copies sim/ and sdr-api/ from the monorepo root.
[build]
builder = "DOCKERFILE"
dockerfilePath = "sdr-api/Dockerfile"
watchPatterns = ["sdr-api/**", "sim/**", "railway.toml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
